spring:
  application:
    name: jeevan-bank
  datasource:
    url: jdbc:postgresql://localhost:5432/jeevan_bank
    username: user
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
#        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

jwt:
  secret: ${JWT_SECRET:ThisIsAVeryLongSecretKeyForJeevanBankJWTAuthenticationThatIsAtLeast256Bits}
  expiration: 86400000

server:
  port: 8080
